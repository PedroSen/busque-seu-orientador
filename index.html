<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b35">
    <meta
      name="description"
      content="Encontre professores orientadores por área de especialidade."
    >
    <title>Busque seu orientador</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>

  <body>
    <div class="container">
        <!--<header class="site-header">
            <h1 class="titulo1">UFRJ - Sistema de busca de orientadores acadêmicos</h1>
        </header>
        <hr>-->

        <main id="inicio">
        <section class="intro">
            <h2 class="titulo2">Busque seu <span>Orientador</span></h2>
        </section>

        <form id="search-form" class="search-form" role="search">
            <div class="search-controls">
                <input id="especialidade-search" name="q" type="search" list="especialidade-options" placeholder="🔍︎ Pesquisar área de interesse, nome, cargo...">
                <datalist id="especialidade-options"></datalist>
                <button type="submit">➜</button>
            </div>
        </form>

        <section class="results-section">
            <div class="results-heading">
            <div>
                <h2 id="results-title">Professores orientadores</h2>
            </div>
            <p id="results-count" class="results-count"></p>
            </div>

            <div id="status" class="status" role="status"></div>
            <div id="results" class="results-list"></div>
        </section>

        </main>
    </div>
    <script defer src="script.js"></script>
  </body>
</html>
